name: Optimizer playground workflow for linting and tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint with ruff
        run: |
          ruff check . 

      - name: Check formatting
        run: |
          ruff format --check .

      - name: Run pytest
        run: |
          pytest --cov=src --cov-report=term-missing
      